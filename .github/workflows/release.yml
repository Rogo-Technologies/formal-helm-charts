name: Release Charts

on:
  push:
    branches:
      - main

# Scoped at the workflow level so the default `GITHUB_TOKEN` cannot do anything beyond
# publishing the chart. chart-releaser needs `contents: write` to push the gh-pages
# index and release tags; granting the default broad scope at the workflow level would
# hand the same power to every step in the job.
permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: true
